limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # 1. Header Validation: Require correct Referer
        # Allows requests only from cenaplus.net and localhost.
        # Note: Nginx matches regex against the text starting *after* http:// or https://
        valid_referers ~^localhost(:[0-9]+)?(/|$) ~^(www\.)?cenaplus\.net(/|$);
                       
        if ($invalid_referer) {
            return 403;
        }

        # 2. Rate Limiting: 5 requests per second per IP
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}